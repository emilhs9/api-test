<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API - Product Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="vereq-qutusu">

    <aside class="yan-panel">
      <div class="panel-ust-hisse">
        <p class="panel-qeydi">mehsulun butun emeliyyatlarinin icra olunacagi link</p>
      </div>

      <div class="panel-alt-hisse" id="mehsul-kecid">
        <div class="mehsul-basligi">PRODUCT</div>
      </div>
    </aside>

    <main class="esas-hisse">

      <header class="esas-basliq">
        <div class="istifadeci-sahesi">
          <span class="istifadeci-adi">EMIL</span>
          <div class="istifadeci-dairesi"></div>
        </div>
      </header>

      <div class="bolunmus-hisse">

        <section class="sutun-blok birinci-sehife">
          <div class="sutun-basligi">
            <span class="sehife-kodu">PAGE 1</span>
          </div>

          <div class="forma-sahesi">
            <form id="mehsul-formu" onsubmit="event.preventDefault();" autocomplete="off">
              <div class="forma-setri">
                <label for="id">ID :</label>
                <input type="text" id="id" placeholder="ID (auto or type)">
                <input type="hidden" id="sil-id">
              </div>

              <div class="forma-setri">
                <label for="ad">TITLE :</label>
                <input type="text" id="ad" placeholder="Product title" required>
              </div>

              <div class="forma-setri">
                <label for="kateqoriya">CATEGORY :</label>
                <input type="text" id="kateqoriya" placeholder="Category">
              </div>

              <div class="forma-setri">
                <label for="baxis">VIEW :</label>
                <input type="number" id="baxis" placeholder="0">
              </div>

              <div class="forma-setri">
                <label for="tarix">DATE :</label>
                <input type="date" id="tarix" required>
              </div>

              <div class="forma-emeliyyatlar">
                <button type="button" class="standart-duyme" id="duyme-gonder" onclick="gonder()">
                  [ SEND ]
                </button>
                <button type="button" class="standart-duyme" id="duyme-deyis" onclick="deyis()">
                  [ UPDATE ]
                </button>
                <button type="button" class="standart-duyme ikinci-dereceli-duyme" id="duyme-temizle" onclick="formuTemizle()">
                  [ CLEAR ]
                </button>
              </div>
            </form>
          </div>
        </section>

        <section class="sutun-blok ikinci-sehife">
          <div class="sutun-basligi">
            <button class="elave-et-duymesi" id="duyme-elave-et">
              ADD NEW
            </button>
            <span class="sehife-kodu">PAGE 2</span>
          </div>

          <div class="cedvel-sahesi">
            <table class="esas-cedvel" id="mehsul-cedveli">
              <thead>
                <tr>
                  <th class="sutun-id">ID</th>
                  <th class="sutun-ad">TITLE</th>
                  <th class="sutun-tarix">DATE</th>
                  <th class="sutun-qelem">EDIT</th>
                  <th class="sutun-qab">DELETE</th>
                </tr>
              </thead>
              <tbody id="cedvel-bedeni">
              </tbody>
            </table>
          </div>
        </section>

      </div>

    </main>

  </div>

  <script src="crud.js"></script>
</body>
</html>
